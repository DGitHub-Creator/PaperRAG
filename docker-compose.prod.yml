# 与 docker-compose.yml 同一个项目名：两份文件用的是同一批 container_name
# （researchpilot-postgres 等），本来就互斥、不能同时起，所以项目名也应该一致，
# 而不是再开一个 researchpilot-prod 让容器标签出现第三种来源。
# 不写 name: 时 Compose 会退回目录名（本机目录仍叫 PaperRAG），标签就成了 paperrag。
#
# ⚠️ 启动命令必须带 --env-file：`docker compose --env-file .env.production -f docker-compose.prod.yml up -d`。
#    下面每个 service 里的 env_file 只注入**容器**环境，不参与 compose **顶层的 ${VAR:?} 插值**，
#    所以少了 --env-file 时 POSTGRES_PASSWORD / MINIO_ACCESS_KEY / MINIO_SECRET_KEY 三个必填项
#    全部报 "required variable is missing a value"（实测 rc=1；补上后 `config` rc=0）。
name: researchpilot
services:
  postgres:
    container_name: researchpilot-postgres
    image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
    environment:
      POSTGRES_DB: langchain_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langchain_app"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    container_name: researchpilot-redis
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # 与开发编排同一处改动，理由相同：`minio/minio` 的开源 Server 已被上游归档（Docker Hub 公开镜像与
  # dl.min.io 均返回 410 Gone），那个 pinned tag 在任何源上都取不到 → 这份 prod 文件今天**起不来**。
  # prod 用环境变量传凭据而不是 command 的 --access/--secret：后者会出现在 `docker inspect` 里。
  # 对外变量名不变（`.env.production.example` 仍写 MINIO_ACCESS_KEY/MINIO_SECRET_KEY），只在容器内改名。
  # ⚠️ 健康检查同 dev 一样从 MinIO 的 /minio/health/live 降级成 TCP 探活（镜像无 curl，也无该端点）。
  minio:
    container_name: milvus-minio
    image: versity/versitygw:v1.8.0
    environment:
      ROOT_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      ROOT_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio_data:/minio_data
    command: ["--port", ":9000", "posix", "/minio_data"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - "etcd"
    restart: unless-stopped

  backend:
    container_name: researchpilot-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    # 必填密钥从 .env.production 读取（参照 .env.production.example）
    env_file:
      - .env.production
    environment:
      # 容器内服务地址（覆盖 .env.production 中的本地地址）
      - DATABASE_URL=postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/langchain_app
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - HF_HOME=/app/models
      - USE_REDIS_JOB_MANAGER=true
      - APP_ENV=production
    volumes:
      - models_data:/app/models
      - app_data:/app/data
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      start_period: 15s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    restart: unless-stopped

  # go-api：唯一公开业务入口（X2）。nginx 只把它当作后端，浏览器面的所有 /api/ 都先到这里。
  # 它直连 PostgreSQL 读写自己那三张表，未迁移的面再反代给 backend（PYTHON_UPSTREAM）。
  # ⚠️ 中国大陆构建时 go mod download 走不通官方源，需要 `--build-arg GOPROXY=https://goproxy.cn,direct`
  #    （Dockerfile 里是 ARG，不在仓库写死，避免换网络环境的机器反而变慢）。
  go-api:
    container_name: researchpilot-go-api
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      # Go 用 pgx，连接串是 postgres:// 方案；Python 那边是 postgresql+psycopg2://。
      # 同一个库、两种写法是刻意的：dev 形态由 dev.py go-serve 做归一化，这里直接写对。
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/langchain_app?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - PYTHON_UPSTREAM=http://backend:8000
      - PORT=8080
      - APP_ENV=production
    # 不发布宿主端口：入口只有 nginx 的 80，探针走容器网络（R4 判的就是这一条）。
    healthcheck:
      # 用 /health 而不是 /ready：/ready 会把 PG 与 Redis 都算进结果，
      # 拿它当门禁等于让"某个依赖抖一下"把整个入口挡在启动之外。
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      start_period: 15s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started 而不是 service_healthy：Go 起来不依赖 Python 健康，
      # 未迁移的面在 Python 恢复前按 502 信封如实报错，比整站起不来好。
      backend:
        condition: service_started
    restart: unless-stopped

  nginx:
    container_name: researchpilot-nginx
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "80:80"
    depends_on:
      go-api:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  models_data:
  app_data:
  app_logs:
