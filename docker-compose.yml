# Compose v2 起 `version:` 字段已废弃且会被忽略（留着每次 config 都吐一条告警）
#
# 项目名必须显式钉住：不写 `name:` 时 Compose 会拿**目录名**当项目名，
# 而本机 clone 目录仍叫 PaperRAG（远端已改名 ResearchPilot，目录名是刻意保留的旧字面量之一），
# 于是容器标签变成 com.docker.compose.project=paperrag，自动创建的网络/具名卷也会带
# paperrag_ 前缀。更要紧的是它**依赖 clone 到哪个目录**——换台机器、换个目录名，
# 项目名就变，可复现性无从谈起。
name: researchpilot
services:
  postgres:
    container_name: researchpilot-postgres
    image: postgres:15@sha256:c961aa287d8698297cb26cdfadfbe9fd2cbaf77e53cfffe9636e8d8a1e4d842c
    environment:
      POSTGRES_DB: langchain_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langchain_app"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    container_name: researchpilot-redis
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 这个服务仍然是 Milvus 的 S3 后端，服务名也仍叫 minio（`MINIO_ADDRESS: minio:9000` 不用改）。
  # 但镜像换掉了：`minio/minio` 的开源 Server 已被上游归档——Docker Hub 的公开镜像和
  # dl.min.io 的下载（含当前版）全部返回 410 Gone，任何镜像源都给不出那个 pinned tag。
  # 换成 versitygw：Apache-2.0、仍在维护、同样讲 S3 协议，posix 后端直接把对象落到挂载目录。
  # 凭据走 ROOT_ACCESS_KEY/ROOT_SECRET_KEY 环境变量而不是 command 的 --access/--secret：
  # versitygw 不读 MINIO_*（留着那两行只会让人以为改密码有效），而 `--access/--secret` 确实有
  # 环境变量兜底（`versitygw gateway --help` 实测：`$ROOT_ACCESS_KEY_ID` / `$ROOT_ACCESS_KEY`，
  # `$ROOT_SECRET_ACCESS_KEY` / `$ROOT_SECRET_KEY`）。用环境变量是为了和 prod 同形，
  # 也让 prod 那对真密钥不会出现在 `docker inspect` 的命令行里。
  # ⚠️ 健康检查从"打 MinIO 的 /minio/health/live"降级成 TCP 探活：versitygw 没有那个端点，
  #    镜像里也没有 curl。这只判"端口在听"，不判"能读写对象"——真正的判据是 standalone 自己 healthy。
  minio:
    container_name: milvus-minio
    image: versity/versitygw:v1.8.0
    environment:
      ROOT_ACCESS_KEY: minioadmin
      ROOT_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: ["--port", ":9000", "posix", "/minio_data"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - "etcd"

  # ⚠️ 这里**没有**应用服务（backend / nginx / go-api），是刻意的，不是漏了。
  # 2026-10-13 定案：dev 形态容器只跑中间件，Go / Python / 前端一律源码跑
  # （`dev.py serve`、`dev.py go-serve`、`npm run dev`）。理由不是省资源，是那份含 torch 的
  # backend 镜像要 16.5 GB，改一行代码就得重建，dev 循环会因此停摆。
  # 由 `check_nginx_routes.py` 的 R5 机检这条定案——往 dev compose 里加回应用服务就会红。
  # 全栈容器形态只在 `docker-compose.prod.yml`（部署形态，含 go-api 与 nginx），本文件的判据不适用于它。
  # 台账 C29 记的就是这次移除；`dev.py migrate` 原先 exec 进本容器跑 alembic，现已改为宿主执行。

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5.11  
    environment:
      - MILVUS_URL=standalone:19530  
      - PORT=3000
    ports:
      # 宿主端口 3001，不是 8080：8080 是 go-api 的默认监听（server/cmd/api/main.go:27），
      # 且 X1 的判据就是 curl localhost:8080/api/v1/health。attu 只是 Milvus 的控制台，
      # 让位给唯一公开入口。
      - "127.0.0.1:3001:3000"
    depends_on:
      - standalone
    networks:
      - default  

networks:
  default:
    name: milvus
