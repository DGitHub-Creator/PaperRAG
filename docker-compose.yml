# Compose v2 起 `version:` 字段已废弃且会被忽略（留着每次 config 都吐一条告警）
#
# 项目名必须显式钉住：不写 `name:` 时 Compose 会拿**目录名**当项目名，
# 而本机 clone 目录仍叫 PaperRAG（远端已改名 ResearchPilot，目录名是刻意保留的旧字面量之一），
# 于是容器标签变成 com.docker.compose.project=paperrag，自动创建的网络/具名卷也会带
# paperrag_ 前缀。更要紧的是它**依赖 clone 到哪个目录**——换台机器、换个目录名，
# 项目名就变，可复现性无从谈起。
name: researchpilot
services:
  postgres:
    container_name: researchpilot-postgres
    image: postgres:15
    environment:
      POSTGRES_DB: langchain_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d langchain_app"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    container_name: researchpilot-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 这个服务仍然是 Milvus 的 S3 后端，服务名也仍叫 minio（`MINIO_ADDRESS: minio:9000` 不用改）。
  # 但镜像换掉了：`minio/minio` 的开源 Server 已被上游归档——Docker Hub 的公开镜像和
  # dl.min.io 的下载（含当前版）全部返回 410 Gone，任何镜像源都给不出那个 pinned tag。
  # 换成 versitygw：Apache-2.0、仍在维护、同样讲 S3 协议，posix 后端直接把对象落到挂载目录。
  # 凭据走 ROOT_ACCESS_KEY/ROOT_SECRET_KEY 环境变量而不是 command 的 --access/--secret：
  # versitygw 不读 MINIO_*（留着那两行只会让人以为改密码有效），而 `--access/--secret` 确实有
  # 环境变量兜底（`versitygw gateway --help` 实测：`$ROOT_ACCESS_KEY_ID` / `$ROOT_ACCESS_KEY`，
  # `$ROOT_SECRET_ACCESS_KEY` / `$ROOT_SECRET_KEY`）。用环境变量是为了和 prod 同形，
  # 也让 prod 那对真密钥不会出现在 `docker inspect` 的命令行里。
  # ⚠️ 健康检查从"打 MinIO 的 /minio/health/live"降级成 TCP 探活：versitygw 没有那个端点，
  #    镜像里也没有 curl。这只判"端口在听"，不判"能读写对象"——真正的判据是 standalone 自己 healthy。
  minio:
    container_name: milvus-minio
    image: versity/versitygw:v1.8.0
    environment:
      ROOT_ACCESS_KEY: minioadmin
      ROOT_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: ["--port", ":9000", "posix", "/minio_data"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"

  backend:
    container_name: researchpilot-backend
    # 显式命名镜像：compose 默认镜像名取 project 名（由目录名推导），
    # 与项目名 researchpilot 的口径不一致，这里钉死。
    image: researchpilot-backend
    build:
      context: .
      dockerfile: Dockerfile
      # Dockerfile 是多阶段构建，最后一个 stage 是 nginx；不写 target 会构建出 nginx 镜像，
      # 容器监听 80 而本服务的端口映射与 healthcheck 都是 8000，必然 unhealthy。
      target: backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/langchain_app
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
      - HF_HOME=/app/models
      # JWT_SECRET_KEY 已无内置默认值，缺失即拒绝启动。此处仅给本地开发栈一个
      # 可用值；生产用 docker-compose.prod.yml + .env.production，或在此注入真实密钥。
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-only-insecure-jwt-secret}
      # LLM_API_KEY / LLM_MODEL 在 backend/core/config 的 validate_config() 里是硬要求
      # （缺失即拒绝启动，实测抛 RuntimeError: Missing required configuration）。
      # 由本地 .env 经 compose 变量替换注入（.env 不入库）。
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/models:/app/models
      - ${DOCKER_VOLUME_DIRECTORY:-.}/data:/app/data
      - ${DOCKER_VOLUME_DIRECTORY:-.}/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      start_period: 15s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      standalone:
        condition: service_healthy

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5.11  
    environment:
      - MILVUS_URL=standalone:19530  
      - PORT=3000
    ports:
      - "8080:3000"
    depends_on:
      - standalone
    networks:
      - default  

networks:
  default:
    name: milvus