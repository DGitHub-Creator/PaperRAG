worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # 入口链：nginx 只承担静态资源与转发，业务入口是 go-api（X2「Go 是唯一公开入口」）。
    # 尚未搬到 Go 的面（documents / chat / ws）由 go-api 进程内反代给 Python，
    # 上游地址由 prod compose 注入（PYTHON_UPSTREAM=http://backend:8000）——**搬一条就少转发一条**。
    upstream go-api {
        server go-api:8080;
    }

    # ⚠️ 这是 04 §5 要求保留的**回退路径**，不是死配置：把下面四个 location 的 proxy_pass 从
    # http://go-api 改回 http://backend，入口整体就退回"Python 直接对浏览器"的原形态，
    # 一行切换、不依赖任何别的改动。注意回退期间 Go 自己的 PYTHON_UPSTREAM 仍指向 backend。
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # API reverse proxy（前端统一走 /api/v1 前缀）
        location /api/ {
            proxy_pass http://go-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # WebSocket proxy（后端真实路由: /api/v1/ws/chat）
        # 必须置于通用 /api/ 之前，携带 Upgrade 头完成协议切换
        location /api/v1/ws/ {
            proxy_pass http://go-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # Health & readiness（探针直通，不走限流）
        location = /health {
            proxy_pass http://go-api;
        }
        location = /ready {
            proxy_pass http://go-api;
        }

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Immutable static assets（Vite 构建产物带内容哈希）
        location /assets/ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
