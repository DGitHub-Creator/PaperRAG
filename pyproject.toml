[project]
name = "researchpilot"
version = "0.2.0"
description = "Academic Paper RAG Platform with Agent Architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "filelock>=3.12.0",
    "fastapi>=0.135.1,<0.136.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.33.0",
    "pymilvus>=2.5.0",
    "python-multipart>=0.0.31",
    "pydantic>=2.8.0",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langchain-huggingface>=0.1.0",
    "langchain-openai>=1.7.2",
    "sentence-transformers>=6.1.0",
    "langgraph>=1.2.16",
    "pypdf>=6.19.0",
    "docx2txt>=0.8",
    "unstructured[doc,xlsx]>=0.27.28",
    "openpyxl",
    "tabulate",
    "msoffcrypto-tool",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "langchain-opendataloader-pdf>=0.1.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.1",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.15.1",
    "alembic>=1.18.0",
    "slowapi>=0.1.9",
    "limits>=5.0",
    "prometheus-client>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = [
    "alembic*",
    "frontend*",
    "logs*",
    "models*",
    "tests*",
]

[project.optional-dependencies]
study = [
    "langchain-classic>=1.0.8",
    "bilibili-api-python>=17.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.6.0",
    # contracts/openapi.yaml 是手写的，check_contracts.py 需要解析它；
    # 现在靠 langchain 的传递依赖能用，但门禁不能建在别人的依赖树上
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
# 分层含义见 docs/rules/08-principles-and-conventions.md §4（证据等级 none<mock<real<e2e）
# 未显式声明 marker 的用例由 tests/conftest.py 按所在目录补齐
markers = [
    "unit: 纯内存单测，不打真实服务（mock 级）",
    "integration: 应用级测试，TestClient 或真实 PG/Redis（mock/real 级）",
    "chain: Go↔Python 真实链路契约测试，需 docker compose 起栈（real 级）",
    "e2e: 浏览器端到端（Playwright），需完整栈与 LLM 密钥（e2e 级）",
    "slow: 耗时长，不进默认门禁，按需手动跑",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "backend/vectordb/*",
    "backend/rag/document_loader.py",
    "backend/core/database.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "logger.warning",
    "logger.exception",
    "logger.debug",
    "logger.info",
]
fail_under = 40
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "W", "B006", "B012", "B023", "B904", "B905", "S110", "S307", "S501", "S506", "S113"]
ignore = ["E402", "W291"]

[tool.ruff.lint.per-file-ignores]
# 内嵌的 HTML/JS 看板模板：长行是产物结构，拆开反而更难维护
"scripts/sync_progress.py" = ["E501"]


