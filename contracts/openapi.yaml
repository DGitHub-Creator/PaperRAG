# ResearchPilot 对浏览器的 HTTP 契约（Go 为唯一公开入口）
#
# 依据：docs/reference/01-current-architecture.md §3（25 条 As-Is，其中 13 条前端在调）、
#       §6（三个必须保持形状的语义）、docs/rules/02-target-architecture.md §2/§3.5。
# 版本选择 3.0.3 而非 3.1：本文件是**手写的人读契约**，3.0.3 的 `nullable` 无歧义，
# 且 P0-5 的跨语言测试只需比对结构与字段，不需要和服务器的自动导出做字节级 diff。
#
# 契约哲学（原则②：完成=可验证行为）：
#   只锁「前端确实读取的字段」——它们必须存在、类型必须稳定；其余字段允许 Python 侧透传。
#   2026-10-17 更新（P1 设计审查 §8 / 台账 C38）：一旦同一形状有**第二个实现方**，
#   "只锁子集"就不再够用——Go 原生接管会话详情读时，未声明的字段无处可查，只能凭空再造一套真相。
#   因此 rag_trace 的投影面（RagTrace 及其四个嵌套模型）现在**全量声明**，
#   由 `scripts/check_contracts.py` 三方核对 openapi ↔ Python 模型 ↔ Go 字段表；
#   其余仍无人读取的透传字段不在全量之列。

openapi: 3.0.3
info:
  title: ResearchPilot browser-facing API
  version: 0.1.0
  description: |
    Go (`go-api`) 是唯一面向浏览器的入口（02 §0 律 1、X2）。
    本契约覆盖 16 条前端在用接口 + 5 条探针接口（共 21 个操作）；其余 12 条 As-Is
    接口无人调用，处置见 03-gap-analysis §5，**不在本契约内**——Go 不实现它们，
    直到 P1 有需求。

    请求追踪头 `X-Trace-Id`（定义见 `components.parameters.TraceId`，台账 C38）：
    它对**每一个** operation 都成立，因此不逐条重复声明——重复 21 遍就是 21 个会各自腐烂的副本。
    口径：入口按 `TraceId` 的形状校验入站值，合法则沿用、非法或缺失则生成新值，
    并把最终值写回响应头；生成形态两侧保留差异（Go 16 位十六进制、Python 直连 32 位），
    只统一**接受集合**不统一**长度**。该头只用于关联日志，**不参与认证或授权判定**，
    也不能当作防重放或幂等键；非法值一律不回显。
    三方一致由 `scripts/check_contracts.py` 核对：本节的 pattern/minLength/maxLength
    ↔ Go 的 `observability.TraceIDRule` ↔ Python 的 `logging_config.TRACE_ID_RULE`。
    （不在公开契约里点名实现文件的目录路径：本文件有条守卫要求服务内部面的路径前缀
    不得出现在这里，源码路径的字面量会误伤它。）
  x-decisions:
    # 2026-10-09 拍板，K1/K4 已落进代码（backend/core/exceptions.py）与本草稿。
    # 留这份记录是为了让"为什么 429 不是 slowapi 的形状"有据可查，不是待办。
    - id: K1
      topic: "429 信封统一为 {\"detail\": ...}"
      status: decided
      landed: "backend/core/exceptions.py:rate_limit_exceeded_handler（同步 handler，见 §2 注释）"
      evidence: tests/integration/test_rate_limit_enforcement.py
    - id: K2
      topic: "sqlc 生成物入库"
      status: decided
      landed: "P0-3：server/sqlc.yaml + 生成代码提交，CI 用 `sqlc generate --diff` 门禁"
    - id: K3
      topic: "nginx upstream 切 Go 的时机"
      status: decided
      landed: "P0-8 末、P0-9 之前，且必须先过 X5（compose 起全栈）"
    - id: K4
      topic: "422 降级为 400 + 字符串 detail"
      status: decided
      landed: "backend/core/exceptions.py:request_validation_error_handler"
      evidence: tests/integration/test_error_envelope.py

servers:
  - url: /
    description: nginx 同源；dev 下由 Vite 代理到 8080（go-api，vite.config.js:13；2026-10-13 前指向 8000/Python）

# 默认全部需要 Bearer；公开接口逐个用 `security: []` 覆盖（register/login/探针）。
# check_contracts.py 依赖这个约定判定「需鉴权却没声明 401」。
security:
  - bearerAuth: []

tags:
  - name: auth
  - name: sessions
  - name: chat
  - name: documents
  - name: probes

paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: 注册并直接返回 token（As-Is：注册即登录）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: 校验 token 并回显身份（前端启动时探测登录态）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: 改密码（校验旧口令后写入新哈希）
      description: |
        2026-10-14 新开的 **Go 独占**面：As-Is 的 Python 侧没有这个端点，
        所以这里没有需要对齐的旧行为。两处口径是新的、且写进了 Go 单测：
        ①**旧口令错回 400 而不是 401**——前端把 401 当"会话过期"来收尾（清 token 跳登录页），
        而"旧口令打错了"不该把用户踢出登录态；
        ②新口令与 register 同一套规则（码点长度 + 至少两类字符），不 strip。
        成功体只有 `{"status":"ok"}`，**不重新签发 token**（旧 token 在 exp 前仍有效，
        这与 As-Is 一致：令牌按 exp 失效，不做改密即吊销）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/preferences:
    get:
      tags: [auth]
      operationId: getPreferences
      summary: 读当前用户的偏好（设置页的「偏好设置」「外观·主题」）
      description: |
        库中没有行时回默认值 `{theme: system, start_view: chat}`，**不是 404**：
        "还没设置过"与"设置读不出来"是两回事，后者才该报错。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [auth]
      operationId: putPreferences
      summary: 整行覆盖当前用户偏好（upsert）
      description: |
        两个字段都是闭集/短 slug，所以是整行覆盖而不是部分更新。
        `theme` 是闭集（与迁移的 CHECK、Go 常量同值）；`start_view` 只校验**形状**
        （小写 slug），不把前端的路由名抄进 Go——不认识的名字由前端在跳转时回退到 chat。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferences"
      responses:
        "200":
          description: 成功（回显实际落库的值）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: 会话列表，**无分页**（01 §6.2：全仓无 offset/page_size/total）
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/sessions/{session_id}:
    get:
      tags: [sessions]
      operationId: getSession
      description: |
        **没有 404 这一条**：`backend/api/sessions.py:21` 与 Go 接管后的实现同样对
        "会话不存在"和"会话属于别人"返回 200 + `{"messages": []}`——这条读接口不做存在性判断，
        改成 404 会多送出一个"这个会话号存在"的信号。鉴权仍然先行：无令牌一律 401。
        存储失败时两侧都给 detail 信封的 500（文案与错误码表在 `contracts/error-codes.md`，
        全契约的 5xx 一律不在 operation 里重复声明，本节也不开这个头）。
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: '成功；空会话、别人的会话、不存在的会话都是 `{"messages": []}`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMessagesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [sessions]
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      description: |
        前端目前只看 res.ok 不解析 body（useSessions.ts:43），但响应形状仍是 As-Is 的
        {session_id, message}，Go 不得为了省事改成 204 —— 会让复用同一 endpoint 的脚本失配。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDeleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/chat/stream:
    post:
      tags: [chat]
      operationId: chatStream
      summary: SSE 流式问答
      description: |
        响应是 text/event-stream，不是 JSON：每帧 `data: <json>\n\n`，终止帧字面量
        `data: [DONE]`（非 JSON，01 §4）。WS 通道剥掉 `data: ` 前缀后透传同一批事件，
        并把流结束改写为 {"type":"done"}。
        必须保留的响应头：Cache-Control: no-cache, no-store, must-revalidate、
        Connection: keep-alive、X-Accel-Buffering: no（nginx 缓冲会让 SSE 变成一次性返回）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE 流
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: 文档列表，**无分页**（As-Is 由 Milvus limit=10000 兜住）
      description: |
        As-Is 语义坑：DocumentInfo.uploaded_at 声明了但后端从未赋值
        （documents.py:396-402 只构造 filename/file_type/chunk_count 三个键），
        线上恒为 null。Go 接管后要么补上真实值、要么删掉字段——**不能默默改成有值**，
        前端排序逻辑依赖它恒 null 的现状。
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/documents/upload/async:
    post:
      tags: [documents]
      operationId: startUploadJob
      summary: multipart 上传并返回 job_id（前端唯一的长任务入口）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/documents/upload/jobs/{job_id}:
    get:
      tags: [documents]
      operationId: getUploadJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/delete/async/{filename}:
    delete:
      tags: [documents]
      operationId: startDeleteJob
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: 文件名（As-Is 用名字而非 id 定位；含特殊字符需 URL 编码）
      responses:
        "200":
          description: 已受理
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStartResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/delete/jobs/{job_id}:
    get:
      tags: [documents]
      operationId: getDeleteJob
      description: 与上传任务**同一响应形状**（As-Is 里 DocumentDeleteJobResponse 是空壳子类）
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/ws/chat:
    get:
      tags: [chat]
      operationId: wsChat
      summary: WebSocket 问答通道
      description: |
        OpenAPI 对 WebSocket 没有正式表达，此处以「GET + 101」占位，
        真正约束是：鉴权走 **query 参数 `token`**（浏览器 WebSocket 不能带 Authorization 头），
        URL 由前端 `api/ws.ts` 从 `location.host` 与 `api/http.ts` 的 `BASE` 拼出（换前缀只改一处），
        入站消息 {"message": str, "session_id": str}，出站帧是 StreamEvent 的 JSON 本体
        （无 `data: ` 前缀），流结束额外发 {"type":"done"}。
        URL 在前端由 api/ws.ts 用 BASE + location.host 现场拼装（wsChatUrl），
        所以 basePath 变更只需要改 api/http.ts 的 BASE 一处，SSE 与 WS 同源。
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "101":
          description: 升级成功
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/health:
    get:
      tags: [probes]
      operationId: health
      summary: 存活探针
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health:
    get:
      tags: [probes]
      operationId: healthRootAlias
      summary: 存活探针的根路径别名
      description: |
        As-Is 的 health/ready 挂在根（app.py:130-137），compose healthcheck 与监控脚本打的是根路径。
        Go 同时提供 /api/v1/* 与根别名，nginx upstream 切换时不能让它们变 404。
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/ready:
    get:
      tags: [probes]
      operationId: ready
      summary: 就绪探针（依赖逐项探测，单项超时不拖垮整体）
      security: []
      responses:
        "200":
          description: 全部依赖就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: 有依赖未就绪；失败时整体包在 detail 信封里（HTTPException 语义）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyUnhealthyResponse"

  /ready:
    get:
      tags: [probes]
      operationId: readyRootAlias
      summary: 就绪探针的根路径别名
      security: []
      responses:
        "200":
          description: 全部依赖就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: 有依赖未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyUnhealthyResponse"

  /metrics:
    get:
      tags: [probes]
      operationId: metrics
      summary: Prometheus 文本格式
      security: []
      responses:
        "200":
          description: 指标
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: As-Is 的 access token；Go 接管签发后 claims 集合必须与 Python 互验（X4）

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    TraceId:
      # 请求追踪头（设计审查 §1/§8，台账 C38）。对每个 operation 成立，见 info.description。
      name: X-Trace-Id
      in: header
      required: false
      description: |
        1–128 个 ASCII 字母、数字、`.`、`_`、`-`。合法则沿用，非法或缺失由入口生成新值；
        响应头里的值一定是最终采用的那个，非法入站值**不回显**。只用于关联日志，
        不参与认证/授权，也不能当幂等键或防重放凭据。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]{1,128}$"

  responses:
    BadRequest:
      description: 请求非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"
    Unauthorized:
      description: 缺 token / token 失效 / 角色不符
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"
    Forbidden:
      description: 权限不足（含 ADMIN_INVITE_CODE 不匹配）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"
    Conflict:
      description: 用户名已存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"
    PayloadTooLarge:
      description: 超过 MAX_UPLOAD_SIZE_MB
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"
    BadGateway:
      description: 上游模型限流/配额耗尽（As-Is 由 chat.py 转成 502，不是 429）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"
    TooManyRequests:
      description: |
        本服务自己的限流（slowapi）。决策 K1：与其余错误共用 detail 信封，
        Python 侧由 backend/core/exceptions.py:rate_limit_exceeded_handler 产出，
        Go 侧 P1 复刻同一条形状。响应头带 X-RateLimit-{Limit,Remaining,Reset} 与 Retry-After。
      headers:
        X-RateLimit-Limit:
          description: 当前窗口的配额
          schema:
            type: string
        X-RateLimit-Remaining:
          description: 当前窗口剩余额度
          schema:
            type: string
        X-RateLimit-Reset:
          description: 窗口重置的 Unix 秒
          schema:
            type: string
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DetailError"

  schemas:
    DetailError:
      type: object
      required: [detail]
      description: |
        全局唯一错误信封（01 §6.1，决策 K1/K4 之后不再有第二种形状）。
        422 已被降级为 400 + 本信封（K4）：FastAPI 默认的 detail 数组带 pydantic
        决定的 ctx/url 字段，Go 用 chi 复刻不起，前端也只把 detail 当字符串显示。
      properties:
        detail:
          type: string

    Role:
      type: string
      enum: [user, admin]
      description: 角色以 DB 为准；core/auth.py 把非 admin 一律折叠为 user

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          nullable: true
          default: user
          description: 仅 admin 进入邀请码校验；其他字符串、null 或缺省均作为 user 注册。
        admin_code:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [access_token, refresh_token, username, role]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer
        username:
          type: string
        role:
          allOf:
            - $ref: "#/components/schemas/Role"

    CurrentUserResponse:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          allOf:
            - $ref: "#/components/schemas/Role"

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string

    StatusOkResponse:
      type: object
      description: 无实体可回的操作的统一成功体（当前只有改密码）
      required: [status]
      properties:
        status:
          type: string
          enum: ["ok"]

    UserPreferences:
      type: object
      description: |
        设置页的用户自助偏好。`theme` 是闭集，三处同值：迁移 000003 的 CHECK、
        Go 的 auth.Theme* 常量、这里的 enum——改一处必须同改另两处。
        `start_view` 只锁**形状**（小写 slug），具体路由名归前端（router/index.ts）。
      required: [theme, start_view]
      properties:
        theme:
          type: string
          enum: ["light", "dark", "system"]
          default: system
        start_view:
          type: string
          pattern: "^[a-z][a-z0-9_-]{0,31}$"
          default: chat

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        session_id:
          type: string
          nullable: true
          default: default_session

    RetrievedChunk:
      type: object
      description: |
        检索到的单个分块。由 backend/schemas/schemas.py:56 的 RetrievedChunk 声明并投影；
        字段名与顺序与 Python 侧逐字一致（`scripts/check_contracts.py` 三方核对 openapi/Python/Go）。
      required: [filename]
      properties:
        filename:
          type: string
        page_number:
          oneOf:
            - type: string
            - type: integer
          nullable: true
        text:
          type: string
          nullable: true
        score:
          type: number
          nullable: true
        rrf_rank:
          type: integer
          nullable: true
        rerank_score:
          type: number
          nullable: true
        parent_idx:
          type: integer
          nullable: true
        child_idx:
          type: integer
          nullable: true
        has_theorem_in_parent:
          type: boolean
          nullable: true
        has_proof_in_parent:
          type: boolean
          nullable: true
        chapter_path:
          type: string
          nullable: true

    SourceReference:
      type: object
      description: RAG 追踪与引用共用的来源标签。声明方 backend/schemas/schemas.py:85。
      properties:
        filename:
          type: string
          nullable: true
        page:
          oneOf:
            - type: string
            - type: integer
          nullable: true
        chunk_id:
          type: string
          nullable: true
        source_label:
          type: string
          nullable: true

    CitationInfo:
      type: object
      description: |
        一条引用的标签校验结果。supported=true 只表示 `[Source N]` 标签存在并被解析，
        **不表示该陈述被证据语义接地**（D3 口径：P1 期间引用一律为非证据级）。
        声明方 backend/schemas/schemas.py:94。
      properties:
        claim:
          type: string
          nullable: true
        source_label:
          type: string
          nullable: true
        filename:
          type: string
          nullable: true
        page:
          oneOf:
            - type: string
            - type: integer
          nullable: true
        chunk_id:
          type: string
          nullable: true
        supported:
          type: boolean
          nullable: true
        reason:
          type: string
          nullable: true

    UnsupportedClaim:
      type: object
      description: 无法落到检索证据上的陈述。声明方 backend/schemas/schemas.py:106。
      required: [claim]
      properties:
        claim:
          type: string
        reason:
          type: string
          nullable: true
        suggested_action:
          type: string
          nullable: true

    RagTrace:
      type: object
      description: |
        由 backend/schemas/schemas.py:114 的 RagTrace 声明并投影，**不保证未知字段透传**：
        未声明的键在读取时被丢弃，声明了但历史行里没有的键输出 null（见下方"读取投影"）。
        新写入在保存前校验（`conversation_storage.py:22` 的 `RagTrace.model_validate`），
        落库用 `model_dump(exclude_none=True)`，REST 响应用**全量键**——两者不对称是有意的。
        历史消息的追踪无法解析时 rag_trace 返回 null、正文保留并记录警告；不伪造检索证据。
        citations 保存 supported=true/false 的引用标签校验结果；标签存在不等同于语义接地。

        读取投影（Go 与 Python 必须逐字一致，判据见 tests/chain/test_go_read_session_detail.py）：
          1. tool_used / tool_name 缺失或类型不符 → **整条** rag_trace 为 null，不是逐字段降级；
          2. 未声明的键丢弃（两侧都是默认 extra=ignore）；
          3. 声明了但缺失的可选键输出 null，所以响应里的键集合恒为本节列出的全部字段；
          4. 嵌套元素里任何一条不满足 1–3 同样使**整条** rag_trace 为 null。
      required: [tool_used, tool_name]
      properties:
        tool_used:
          type: boolean
        tool_name:
          type: string
        query:
          type: string
          nullable: true
        expanded_query:
          type: string
          nullable: true
        step_back_question:
          type: string
          nullable: true
        step_back_answer:
          type: string
          nullable: true
        expansion_type:
          type: string
          nullable: true
        hypothetical_doc:
          type: string
          nullable: true
        retrieval_stage:
          type: string
          nullable: true
        grade_score:
          type: string
          nullable: true
        grade_route:
          type: string
          nullable: true
        rewrite_needed:
          type: boolean
          nullable: true
        rewrite_strategy:
          type: string
          nullable: true
        rewrite_query:
          type: string
          nullable: true
        rerank_enabled:
          type: boolean
          nullable: true
        rerank_applied:
          type: boolean
          nullable: true
        rerank_model:
          type: string
          nullable: true
        rerank_endpoint:
          type: string
          nullable: true
        rerank_error:
          type: string
          nullable: true
        retrieval_mode:
          type: string
          nullable: true
        candidate_k:
          type: integer
          nullable: true
        leaf_retrieve_level:
          type: integer
          nullable: true
        auto_merge_enabled:
          type: boolean
          nullable: true
        auto_merge_applied:
          type: boolean
          nullable: true
        auto_merge_threshold:
          type: integer
          nullable: true
        auto_merge_replaced_chunks:
          type: integer
          nullable: true
        auto_merge_steps:
          type: integer
          nullable: true
        context_expansion_enabled:
          type: boolean
          nullable: true
        context_expansion_applied:
          type: boolean
          nullable: true
        expand_prev_parent:
          type: integer
          nullable: true
        expand_next_parent:
          type: integer
          nullable: true
        expand_max_chunks:
          type: integer
          nullable: true
        expanded_chunk_count:
          type: integer
          nullable: true
        retrieved_chunks:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RetrievedChunk"
        initial_retrieved_chunks:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RetrievedChunk"
        expanded_retrieved_chunks:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RetrievedChunk"
        source_map:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/SourceReference"
        citations:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CitationInfo"
        unsupported_claims:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/UnsupportedClaim"

    StreamEvent:
      description: |
        SSE/WS 共用的事件帧本体。一支一型，discriminator 是 type 字段（01 §4）。
        注意 content 是**整段最终答案一次性下发**，不是 token 增量——别按流式渲染做假设。
      discriminator:
        propertyName: type
        mapping:
          content: "#/components/schemas/StreamContentEvent"
          rag_step: "#/components/schemas/StreamRagStepEvent"
          citations: "#/components/schemas/StreamCitationsEvent"
          trace: "#/components/schemas/StreamTraceEvent"
          error: "#/components/schemas/StreamErrorEvent"
          done: "#/components/schemas/StreamDoneEvent"
      oneOf:
        - $ref: "#/components/schemas/StreamContentEvent"
        - $ref: "#/components/schemas/StreamRagStepEvent"
        - $ref: "#/components/schemas/StreamCitationsEvent"
        - $ref: "#/components/schemas/StreamTraceEvent"
        - $ref: "#/components/schemas/StreamErrorEvent"
        - $ref: "#/components/schemas/StreamDoneEvent"

    StreamContentEvent:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [content]
        content:
          type: string

    StreamRagStepEvent:
      type: object
      required: [type, step]
      properties:
        type:
          type: string
          enum: [rag_step]
        step:
          type: object
          required: [icon, label, detail]
          properties:
            icon:
              type: string
            label:
              type: string
            detail:
              type: string

    StreamCitationsEvent:
      type: object
      required: [type, citations, unsupported]
      description: 数组元素形状不锁（claim/source_label/supported 等由 Python 侧演进），只锁键名与是数组
      properties:
        type:
          type: string
          enum: [citations]
        citations:
          type: array
          items:
            type: object
        unsupported:
          type: array
          items:
            type: object

    StreamTraceEvent:
      type: object
      required: [type]
      description: rag_trace 与 source_map 均「仅在非空时才发」，所以两者都是可选键
      properties:
        type:
          type: string
          enum: [trace]
        rag_trace:
          allOf:
            - $ref: "#/components/schemas/RagTrace"
          nullable: true
        source_map:
          type: object
          additionalProperties:
            type: object

    StreamErrorEvent:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [error]
        content:
          type: string

    StreamDoneEvent:
      type: object
      required: [type]
      description: 仅 WS 存在；SSE 靠流结束与字面量 [DONE] 帧
      properties:
        type:
          type: string
          enum: [done]

    MessageInfo:
      type: object
      required: [type, content, timestamp]
      description: timestamp 是 ISO-8601 **字符串**不是 datetime（As-Is 如此，Go 别自作主张改）
      properties:
        type:
          type: string
          description: 实测 human/ai/system；后端声明为裸 str，不校验
        content:
          type: string
        timestamp:
          type: string
        rag_trace:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RagTrace"

    SessionInfo:
      type: object
      required: [session_id, updated_at, message_count]
      properties:
        session_id:
          type: string
        updated_at:
          type: string
        message_count:
          type: integer
      additionalProperties: true

    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    SessionMessagesResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MessageInfo"

    SessionDeleteResponse:
      type: object
      required: [session_id, message]
      properties:
        session_id:
          type: string
        message:
          type: string

    DocumentInfo:
      type: object
      required: [filename, file_type, chunk_count]
      properties:
        filename:
          type: string
        file_type:
          type: string
        chunk_count:
          type: integer
        uploaded_at:
          type: string
          nullable: true

    DocumentListResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentInfo"

    JobStartResponse:
      type: object
      required: [job_id, filename, message]
      properties:
        job_id:
          type: string
        filename:
          type: string
        message:
          type: string

    JobStepStatus:
      type: string
      enum: [pending, running, completed, failed]

    JobStep:
      type: object
      required: [key, label, percent, status]
      properties:
        key:
          type: string
          description: upload/cleanup/parse/parent_store/vector_store、scan、prepare/bm25/milvus
        label:
          type: string
          description: 中文展示串，契约不锁其值
        percent:
          type: integer
          minimum: 0
          maximum: 100
        status:
          $ref: "#/components/schemas/JobStepStatus"
        message:
          type: string
          default: ""

    JobStatusResponse:
      type: object
      required: [job_id, status, message, steps]
      description: |
        上传与删除任务共用此形状。As-Is 内部字典还有个 completion_step 键被 response_model
        丢掉，故**不进契约**。前端在 15 与 6 两处都按 steps 渲染。
      properties:
        job_id:
          type: string
        filename:
          type: string
        status:
          $ref: "#/components/schemas/JobStepStatus"
        current_step:
          type: string
        message:
          type: string
        total_chunks:
          type: integer
          default: 0
        processed_chunks:
          type: integer
          default: 0
        error:
          type: string
          nullable: true
        created_at:
          type: string
        updated_at:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/JobStep"

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    CheckStatus:
      type: object
      required: [status, detail]
      description: |
        checks 是「依赖名 → 状态对象」的映射，键集随服务而异，故契约不锁键名只锁值形状：
        ai-core 报 database/redis/milvus（backend/api/health.py:137-140），
        go-api 只报 database —— 它不依赖 Redis/Milvus，报一个假的 ok 或恒 error 都是说谎。
        监控脚本按值解析即可，别写死 .checks.redis。
      properties:
        status:
          type: string
          enum: [ok, error]
        detail:
          type: string

    ReadyResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CheckStatus"

    ReadyUnhealthyResponse:
      type: object
      required: [detail]
      description: 503 走 HTTPException，故整体包在 detail 里——与 200 的形状**不同构**，客户端两种都要能读
      properties:
        detail:
          type: object
          required: [status, checks]
          properties:
            status:
              type: string
              enum: [unhealthy]
            version:
              type: string
            checks:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/CheckStatus"
