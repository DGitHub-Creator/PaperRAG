name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Lint (ruff)
        run: uv run ruff check backend/ tests/ scripts/

      - name: Run tests
        run: uv run pytest -q --tb=short

  progress:
    name: Progress (plan/schedule sync gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只用标准库，故不起 uv/依赖
      - name: Check progress artifacts match source
        run: python3 scripts/sync_progress.py --check

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target backend -t paperrag-backend .

      - name: Build nginx image
        run: docker build --target nginx -t paperrag-nginx .
