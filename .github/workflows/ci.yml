name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Lint (ruff)
        run: uv run ruff check backend/ tests/ scripts/

      - name: Check API contracts
        run: uv run python scripts/check_contracts.py

      - name: Run tests
        run: uv run pytest -q --tb=short

  go:
    name: Go server (fmt + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # 格式与静态检查先跑：这三条就是 X4 判定命令的前半段（cd server && go vet ./... && go test ./...）
      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  progress:
    name: Progress (plan/schedule sync gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只用标准库，故不起 uv/依赖
      - name: Check progress artifacts match source
        run: python3 scripts/sync_progress.py --check

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 结构门禁：唯一请求出口、token 单一所有者、状态层不碰 DOM 这些约定不靠人盯。
      # 脚本只用标准库，所以这里用 runner 自带的 python3，不为它引 uv。
      - name: Check frontend structure
        run: python3 ../scripts/check_frontend.py

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target backend -t researchpilot-backend .

      - name: Build nginx image
        run: docker build --target nginx -t researchpilot-nginx .
